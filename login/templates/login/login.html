{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="login-box">
  <div class="login-logo">
    <a style="color: white;"><b>Iniciar sesión</b></a>
  </div>
  <!-- /.login-logo -->
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg" style="font-size: 35px; color: black;">Sistema de inventario y facturación para la empresa Dr. Cell</p>

      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible">
          <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
          {{ message }}
        </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Usuario" name="username" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Contraseña" name="password" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-8">
            <div class="icheck-primary">
              <input type="checkbox" id="remember">
              <label for="remember">
                Recordarme
              </label>
            </div>
          </div>
          <div class="col-4">
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
          </div>
        </div>
      </form>

      <p class="mb-1">
        <a href="{% url 'password_reset' %}">Olvidé mi contraseña</a>
      </p>
      <!-- Opcional: Descomentar si necesitas registro -->
      <!-- <p class="mb-0">
        <a href="{% url 'register' %}" class="text-center">Registrarme</a>
      </p> -->
    </div>
    <!-- /.login-card-body -->
  </div>
</div>
{% endblock %}
